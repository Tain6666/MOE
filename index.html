<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration - เสนอชื่อกรรมการ</title>
  
  <link href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600&display=swap');

    html, body { 
      background: url('https://tain6666.github.io/bch.github.io/pic/background welles.jpg') no-repeat center center fixed; 
      background-size: cover;
      margin: 0;
      padding: 0;
      font-family: 'Sarabun', sans-serif;
      font-size: 16px;
      height: 100vh;
      overflow: hidden;
    }

    img.logo {
      display: block;
      margin: 0 auto 15px auto;
      width: 50%;
      height: auto;
      border-radius: 50%;
    }

    #login {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px;
      width: 300px;
      border-radius: 8px;
      background: rgba(93, 74, 255, 0.9);
      box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.5);
    }

    .dropdown-content-student {
      display: none;
      max-height: 200px;
      overflow-y: auto;
      background: #f8f9fa;
      border: 1px solid #ced4da;
      border-radius: 4px;
      position: absolute;
      width: 100%;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <div class="modal fade" id="exampleModal2" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header bg-light">
          <h1 class="modal-title fs-5"><b>📝 รายชื่อแพทย์ที่ผู้บริหารแต่งตั้ง (ไม่อยู่ในรายชื่อที่เลือก)</b></h1>
        </div>
        <div class="modal-body">
          1. นพ.พิพัฒน์ จงกลสิริ<br> 
          2. นพ.นุกูล คุณะไชยโชติ<br> 
          3. นพ.วิชัย นัยรักษ์เสรี<br> 
          4. พญ.พามดา สุวรรณพานิช<br> 
          5. พญ.พัชร เกียรติสารพิภพ 
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary w-100" data-bs-dismiss="modal">ยอมรับ</button>
        </div>
      </div>
    </div>
  </div>

  <div id="login">
    <img class="logo" src="https://tain6666.github.io/bch.github.io/pic/LOGOBCHNEW.png" alt="Logo">
    <div class="text-center text-white mb-3">
      <h4>เข้าระบบ</h4>
      <h5>เสนอชื่อกรรมการ<br>องค์กรแพทย์ ปี 2026</h5>
    </div>
    <form id="loginForm" onsubmit="handleLogin(event)">
      <input type="text" id="user" class="form-control mb-2" placeholder="กรอกรหัสแพทย์" required autocomplete="off">
      <p class="text-white text-center" style="font-size: 0.85rem;">**ตัวอย่าง D12345 หรือ T12345</p>
      <button type="submit" class="btn btn-success w-100 fw-bold">Log in</button>
    </form>
  </div>

  <div class="modal fade" id="exampleModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-light">
          <h1 class="modal-title fs-5">แบบฟอร์มเสนอชื่อ</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="nominationForm" onsubmit="saveData(event)">
            <div class="row mb-2">
              <label class="col-sm-3 col-form-label col-form-label-sm">ชื่อผู้เสนอ</label>
              <div class="col-sm-9">
                <input type="text" class="form-control form-control-sm bg-light" id="dataUser1" name="dataUser1" readonly>
              </div>
            </div>

            <div class="row mb-2">
              <label class="col-sm-3 col-form-label col-form-label-sm">รหัสแพทย์</label>
              <div class="col-sm-9">
                <input type="text" class="form-control form-control-sm bg-light" id="iduser" name="iduser" readonly>
              </div>
            </div>
            
            <div class="row mt-3 position-relative" id="studentNameListDropdown">
              <div class="col-12">
                <label class="form-label fw-bold text-primary">เสนอรายชื่อแพทย์ (ไม่เกิน 6 คน)</label>
                <input type="text" class="form-control border-dark bg-white text-start cursor-pointer" 
                       onclick="toggleDropdown()" id="studentNameList" placeholder="- คลิกเพื่อเลือกรายชื่อแพทย์ -" readonly style="cursor: pointer;">
                
                <div class="dropdown-content-student p-2 mt-1 shadow" id="studentNameListDropdownContent">
                  </div>
              </div>
            </div>

            <input type="hidden" id="studentNameListSave" name="studentNameListSave">

            <div class="row mt-3 mb-3">
              <div class="col-12">
                <textarea class="form-control border-dark bg-light" id="selectedStudentNameTextArea" 
                          placeholder="- ไม่มีรายชื่อแพทย์ที่ถูกเลือก -" rows="2" readonly></textarea>
              </div>
            </div>
              
            <div class="text-center mt-4">
              <button type="submit" class="btn btn-primary w-100 fw-bold">บันทึกข้อมูล</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-loading-overlay@1.1.0/dist/js-loading-overlay.min.js"></script>

  <script>
    // ---------------------------------------------------------
    // ตั้งค่า API URL ตรงนี้ (นำมาจาก Google Apps Script หลัง Deploy)
    // ---------------------------------------------------------
    const API_URL = "https://script.google.com/macros/s/AKfycbyhUCKNt69elkq_Kj1C1Vg8s84iOwt47k-Xim3B6aVma0HmVjd_HUpijalYNovDCNM/exec"; 
    
    let globalData = { login: [], check: [], list: [] };
    const maxSelections = 6;

    // เมื่อโหลดหน้าเว็บเสร็จ
    window.addEventListener('load', async () => {
      $('#exampleModal2').modal('show');
      await fetchInitialData();
    });

    // ดึงข้อมูลรวดเดียวผ่าน API
    async function fetchInitialData() {
      JsLoadingOverlay.show({ spinnerIcon: 'ball-atom' });
      try {
        const response = await fetch(`${API_URL}?action=getInitialData`);
        const result = await response.json();
        
        if (result.status === 'success') {
          globalData.login = result.loginData;
          globalData.check = result.checkData;
          globalData.list = result.studentList;
          
          renderDoctorList(result.studentList);
        }
      } catch (error) {
        console.error("Error fetching data:", error);
        Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อฐานข้อมูลได้', 'error');
      } finally {
        JsLoadingOverlay.hide();
      }
    }

    // วาดรายชื่อแพทย์ใน Dropdown
    function renderDoctorList(list) {
      const container = document.getElementById('studentNameListDropdownContent');
      container.innerHTML = '';
      
      list.forEach((item, index) => {
        const docName = item[1] + item[2];
        const html = `
          <div class="form-check">
            <input class="form-check-input doctor-checkbox" type="checkbox" value="${item[1]}" id="doc_${index}" name="choiceStudent">
            <label class="form-check-label" for="doc_${index}">${docName}</label>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', html);
      });

      // จัดการ Event เมื่อมีการติ๊กเลือก
      document.querySelectorAll('.doctor-checkbox').forEach(checkbox => {
        checkbox.addEventListener('change', handleCheckboxChange);
      });
    }

    // จัดการการ Login
    function handleLogin(event) {
      event.preventDefault();
      const userCode = $('#user').val().trim();
      
      // ตรวจสอบว่าเคยเสนอชื่อไปแล้วหรือไม่
      const isAlreadySubmitted = globalData.check.find(r => r[1] === userCode);
      
      if (isAlreadySubmitted) {
        Swal.fire({
          icon: "success",
          title: 'ลงทะเบียนแล้ว',
          html: `<h3>${isAlreadySubmitted[2]}</h3>
                 <h5>คุณเสนอชื่อแพทย์เรียบร้อยแล้ว</h5><hr>
                 <p>หากท่านต้องการแก้ไข โทรเบอร์ภายใน 20621</p>`, 
          showConfirmButton: true
        });
        return;
      }

      // ตรวจสอบข้อมูลแพทย์ในระบบ
      const isValidUser = globalData.login.find(r => r[0] === userCode);
      
      if (isValidUser) {
        $('#iduser').val(isValidUser[0]);
        $('#dataUser1').val(isValidUser[1]);
        $('#exampleModal').modal('show'); 
      } else {
        Swal.fire({
            icon: 'error',
            title: 'ไม่พบข้อมูล',
            text: 'รหัสแพทย์ไม่ถูกต้อง โปรดลองอีกครั้ง'
        });
        $('#user').val(''); // ล้างค่าเมื่อไม่พบข้อมูล เพื่อเตรียมรับค่าใหม่ทันที
      }
    }

    // เปิด-ปิด Dropdown
    function toggleDropdown() {
      const dropdown = document.getElementById('studentNameListDropdownContent');
      dropdown.style.display = (dropdown.style.display === 'block') ? 'none' : 'block';
    }

    // ปิด Dropdown เมื่อคลิกพื้นที่อื่น
    document.addEventListener('click', function(event) {
      const wrapper = document.getElementById('studentNameListDropdown');
      const dropdown = document.getElementById('studentNameListDropdownContent');
      if (wrapper && !wrapper.contains(event.target)) {
        dropdown.style.display = 'none';
      }
    });

    // จัดการเมื่อมีการเลือกรายชื่อแพทย์
    function handleCheckboxChange() {
      const checkedBoxes = document.querySelectorAll('.doctor-checkbox:checked');
      const allCheckboxes = document.querySelectorAll('.doctor-checkbox');
      
      // ล็อก Checkbox ที่เหลือถ้าเลือกครบโควต้าแล้ว
      const limitReached = checkedBoxes.length >= maxSelections;
      allCheckboxes.forEach(cb => {
        if (!cb.checked) cb.disabled = limitReached;
      });

      let selectedValues = [];
      checkedBoxes.forEach(cb => selectedValues.push(cb.value));

      const inputDisplay = document.getElementById('studentNameList');
      const textArea = document.getElementById('selectedStudentNameTextArea');
      const hiddenInput = document.getElementById('studentNameListSave');

      if (selectedValues.length === 0) {
        inputDisplay.value = '';
        inputDisplay.placeholder = '- คลิกเพื่อเลือกรายชื่อแพทย์ -';
        textArea.value = '';
        hiddenInput.value = '';
      } else {
        inputDisplay.value = `เลือกรายชื่อแล้ว : ${selectedValues.length} คน`;
        hiddenInput.value = selectedValues.join(",");
        textArea.value = selectedValues.join(", ");
        textArea.rows = selectedValues.length + 1;
      }
    }

    // บันทึกข้อมูลผ่าน API
    async function saveData(event) {
      event.preventDefault();
      
      const payload = {
        action: 'saveData',
        data: {
          iduser: $('#iduser').val(),
          dataUser1: $('#dataUser1').val(),
          studentNameListSave: $('#studentNameListSave').val()
        }
      };

      if(!payload.data.studentNameListSave) {
        Swal.fire('แจ้งเตือน', 'กรุณาเสนอรายชื่อแพทย์อย่างน้อย 1 ท่าน', 'warning');
        return;
      }

      JsLoadingOverlay.show({ spinnerIcon: 'ball-atom' });

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        
        const result = await response.json();
        
        if (result.status === 'success') {
          const out = result.data;
          
          // สรุปชื่อที่ถูกเสนอ ดึงข้อมูลจากคอลัมน์ที่ 3 เป็นต้นไป
          const namesHtml = out.slice(3).filter(n => n).map(n => `<h4>${n}</h4>`).join('');

          Swal.fire({
            icon: "success",
            title: 'บันทึกเรียบร้อย',
            html: `<h3>${out[2]}</h3>
                   <h5>คุณเสนอชื่อแพทย์ ดังนี้</h5><hr>
                   ${namesHtml}`
          });
          
          // รีเซ็ตฟอร์ม
          document.getElementById('nominationForm').reset();
          document.getElementById('user').value = "";
          $('#exampleModal').modal('hide');  
          handleCheckboxChange(); // รีเซ็ตการแสดงผล
          
          // โหลดข้อมูล check ใหม่เพื่อกันการส่งซ้ำ
          await fetchInitialData(); 
        }
      } catch (error) {
        console.error("Save Error:", error);
        Swal.fire('ผิดพลาด', 'ไม่สามารถบันทึกข้อมูลได้', 'error');
      } finally {
        JsLoadingOverlay.hide();
      }
    }
  </script>
</body>
</html>
